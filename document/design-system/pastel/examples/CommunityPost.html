<!doctype html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>CommunityPost</title>
<style>html,body{margin:0} body{background:var(--cream-50);padding:24px} .demo{display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body class="kn">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;max-width:560px">
  <article class="kn-card kn-post">
    <div class="kn-media"><svg class="kn-art" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="b" cx="190" cy="40" r="56"/>
<rect class="m7" x="72" y="74" width="10" height="120" rx="5"/>
<rect class="m7" x="118" y="58" width="10" height="136" rx="5"/>
<rect class="m7" x="164" y="88" width="10" height="110" rx="5"/>
<circle class="p6" cx="77" cy="70" r="20"/><circle class="b" cx="123" cy="52" r="22"/><circle class="p6" cx="169" cy="84" r="18"/>
<circle class="w" cx="77" cy="70" r="6"/><circle class="w" cx="123" cy="52" r="7"/><circle class="w" cx="169" cy="84" r="5"/>
</svg></div>
    <div class="kn-card__body">
      <div class="kn-post__author"><span class="kn-avatar" aria-hidden="true">LA</span>
        <span><div class="kn-mat__name">Lan Anh</div><div class="kn-mat__meta">Làm theo: Bó 9 tulip</div></span></div>
      <div class="kn-kit__row"><span class="kn-points">+20 điểm</span><button class="kn-like">♥ 128</button></div>
    </div>
  </article>
  <article class="kn-card kn-post">
    <div class="kn-media" style="background:var(--lilac-100)"><svg class="kn-art" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="l" cx="190" cy="40" r="56"/>
<rect class="m7" x="72" y="74" width="10" height="120" rx="5"/>
<rect class="m7" x="118" y="58" width="10" height="136" rx="5"/>
<rect class="m7" x="164" y="88" width="10" height="110" rx="5"/>
<circle class="p" cx="77" cy="70" r="20"/><circle class="b" cx="123" cy="52" r="22"/><circle class="p" cx="169" cy="84" r="18"/>
<circle class="w" cx="77" cy="70" r="6"/><circle class="w" cx="123" cy="52" r="7"/><circle class="w" cx="169" cy="84" r="5"/>
</svg></div>
    <div class="kn-card__body">
      <div class="kn-post__author"><span class="kn-avatar" aria-hidden="true" style="background:var(--pink-300)">MT</span>
        <span><div class="kn-mat__name">Minh Thư</div><div class="kn-mat__meta">Làm theo: Kẹp tóc hoa cúc</div></span></div>
      <div class="kn-kit__row"><span class="kn-points">+20 điểm</span><button class="kn-like">♥ 64</button></div>
    </div>
  </article>
</div>
</body>
</html>
