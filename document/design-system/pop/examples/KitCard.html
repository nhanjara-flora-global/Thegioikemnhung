<!doctype html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>KitCard</title>
<style>html,body{margin:0} body{background:var(--paper-50);padding:24px} .demo{display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body class="kn">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:24px;max-width:600px">
  <article class="kn-card">
    <div class="kn-media"><svg class="kn-art" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="p" cx="190" cy="40" r="56"/>
<rect class="m7" x="72" y="74" width="10" height="120" rx="5"/>
<rect class="m7" x="118" y="58" width="10" height="136" rx="5"/>
<rect class="m7" x="164" y="88" width="10" height="110" rx="5"/>
<circle class="p6" cx="77" cy="70" r="20"/><circle class="b" cx="123" cy="52" r="22"/><circle class="p6" cx="169" cy="84" r="18"/>
<circle class="w" cx="77" cy="70" r="6"/><circle class="w" cx="123" cy="52" r="7"/><circle class="w" cx="169" cy="84" r="5"/>
</svg>
      <div class="kn-media__badges"><span class="kn-tag kn-tag--hot">★ Bán chạy</span></div>
    </div>
    <div class="kn-card__body">
      <span class="kn-tag kn-tag--beginner" style="justify-self:start">Người mới</span>
      <h3 class="kn-h3">Set DIY bó 9 tulip hồng phấn</h3>
      <p class="kn-muted">27 sợi kẽm, 9 kẽm cành, băng keo sáp, giấy gói, thiệp</p>
      <div class="kn-kit__row"><span class="kn-price">149.000₫<span class="kn-kit__old">179.000₫</span></span>
        <button class="kn-btn kn-btn--primary kn-btn--sm" aria-label="Thêm set tulip vào giỏ">Thêm vào giỏ</button></div>
    </div>
  </article>
  <article class="kn-card">
    <div class="kn-media" style="background:var(--violet-100)"><svg class="kn-art" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="l" cx="190" cy="40" r="56"/>
<rect class="m7" x="72" y="74" width="10" height="120" rx="5"/>
<rect class="m7" x="118" y="58" width="10" height="136" rx="5"/>
<rect class="m7" x="164" y="88" width="10" height="110" rx="5"/>
<circle class="p" cx="77" cy="70" r="20"/><circle class="b" cx="123" cy="52" r="22"/><circle class="p" cx="169" cy="84" r="18"/>
<circle class="w" cx="77" cy="70" r="6"/><circle class="w" cx="123" cy="52" r="7"/><circle class="w" cx="169" cy="84" r="5"/>
</svg></div>
    <div class="kn-card__body">
      <span class="kn-tag kn-tag--advanced" style="justify-self:start">Nâng cao</span>
      <h3 class="kn-h3">Set DIY chậu lan hồ điệp</h3>
      <p class="kn-muted">Kẽm lông dày, nhị hoa, chậu sứ mini</p>
      <div class="kn-kit__row"><span class="kn-price">289.000₫</span>
        <button class="kn-btn kn-btn--primary kn-btn--sm" aria-label="Thêm set lan vào giỏ">Thêm vào giỏ</button></div>
    </div>
  </article>
</div>
</body>
</html>
