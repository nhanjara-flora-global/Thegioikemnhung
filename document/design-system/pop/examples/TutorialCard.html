<!doctype html>
<html lang="vi">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../components.css"><meta charset="utf-8"><title>TutorialCard</title>
<style>html,body{margin:0} body{background:var(--paper-50);padding:24px} .demo{display:flex;flex-wrap:wrap;gap:16px;align-items:center}</style></head>
<body class="kn">
<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:24px;max-width:560px">
  <article class="kn-card">
    <div class="kn-media kn-media--video"><svg class="kn-art" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="m" cx="190" cy="40" r="56"/>
<rect class="m7" x="72" y="74" width="10" height="120" rx="5"/>
<rect class="m7" x="118" y="58" width="10" height="136" rx="5"/>
<rect class="m7" x="164" y="88" width="10" height="110" rx="5"/>
<circle class="p6" cx="77" cy="70" r="20"/><circle class="b" cx="123" cy="52" r="22"/><circle class="p6" cx="169" cy="84" r="18"/>
<circle class="w" cx="77" cy="70" r="6"/><circle class="w" cx="123" cy="52" r="7"/><circle class="w" cx="169" cy="84" r="5"/>
</svg>
      <div class="kn-media__badges"><span class="kn-tag kn-tag--beginner">Người mới</span></div>
      <button class="kn-play" aria-label="Phát video: Làm hoa tulip đơn giản"></button>
      <span class="kn-media__time">0:58</span>
    </div>
    <div class="kn-card__body">
      <h3 class="kn-h3">Làm hoa tulip đơn giản</h3>
      <p class="kn-muted kn-caption">12 bước · 15 phút</p>
      <a class="kn-btn kn-btn--primary kn-btn--sm kn-btn--block" href="#">Mua nguyên liệu làm tulip</a>
    </div>
  </article>
  <article class="kn-card">
    <div class="kn-media kn-media--video kn-media--orange"><svg class="kn-art" viewBox="0 0 240 180" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
<circle class="o" cx="190" cy="40" r="56"/>
<rect class="m7" x="72" y="74" width="10" height="120" rx="5"/>
<rect class="m7" x="118" y="58" width="10" height="136" rx="5"/>
<rect class="m7" x="164" y="88" width="10" height="110" rx="5"/>
<circle class="p6" cx="77" cy="70" r="20"/><circle class="b" cx="123" cy="52" r="22"/><circle class="p6" cx="169" cy="84" r="18"/>
<circle class="w" cx="77" cy="70" r="6"/><circle class="w" cx="123" cy="52" r="7"/><circle class="w" cx="169" cy="84" r="5"/>
</svg>
      <div class="kn-media__badges"><span class="kn-tag kn-tag--medium">Trung bình</span></div>
      <button class="kn-play" aria-label="Phát video: Hoa mai trang trí Tết"></button>
      <span class="kn-media__time">2:14</span>
    </div>
    <div class="kn-card__body">
      <h3 class="kn-h3">Cành mai trang trí Tết</h3>
      <p class="kn-muted kn-caption">20 bước · 40 phút</p>
      <a class="kn-btn kn-btn--primary kn-btn--sm kn-btn--block" href="#">Mua nguyên liệu làm cành mai</a>
    </div>
  </article>
</div>
</body>
</html>
